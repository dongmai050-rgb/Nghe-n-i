<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DAY 01 · Luyện nghe</title><style>*{box-sizing:border-box}body{font:16px system-ui;background:#f5f7f8;color:#20332e;margin:0 auto;max-width:850px;padding:16px}h1{font-size:25px;margin-bottom:4px}h2{font-size:18px}button,select{font:inherit;border:1px solid #c5d2cd;border-radius:9px;padding:10px;background:white;color:inherit}button{cursor:pointer}button.primary{background:#17664d;color:white}section{background:white;border-radius:15px;padding:16px;margin:14px 0} .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}label{display:inline-block;margin:5px}input[type=range]{width:100%}.line{padding:12px;border-radius:12px;background:#edf0f2;margin:7px 0}.answer{background:#e4f1e8}.active{outline:2px solid #17664d}.ko{font-size:20px;font-weight:600;line-height:1.5}.vi{color:#53635d;margin:5px 0}.hideko .ko,.hidevi .vi{display:none}small{color:#53635d}.sticky{position:sticky;top:0;z-index:2;box-shadow:0 3px 15px #0001}#status{min-height:24px}</style><h1>DAY 01 · Luyện nghe</h1><div>오랜만에 친구 만나기</div><section class="sticky"><div class="controls"><button class="primary" id="play">▶ Nghe toàn bài</button><button id="pause">Dừng</button><button id="prev">⏮ Câu trước</button><button id="next">Câu sau ⏭</button></div><p id="status" aria-live="polite">Chọn câu hoặc nghe toàn bài</p><input id="seek" type="range" min="0" max="25" value="0"><small id="pos">Câu 1 / 26</small><div class="controls"><label>Chế độ <select id="mode"><option value="listen">Nghe</option><option value="shadow">Shadowing</option><option value="answer">Tự trả lời</option></select></label><label>Khoảng nghỉ <select id="gap"><option>5</option><option selected>15</option><option>10</option><option>20</option><option>30</option></select> giây</label><label>Lặp <select id="repeat"><option>1</option><option>3</option><option>5</option><option value="0">Liên tục</option></select></label></div><div class="controls"><label>Tốc độ <select id="rate"><option>0.6</option><option>0.8</option><option selected>1</option><option>1.2</option></select></label><select id="voice"><option value="">Giọng Hàn mặc định</option></select><label><input id="ko" type="checkbox" checked> Tiếng Hàn</label><label><input id="vi" type="checkbox" checked> Tiếng Việt</label></div><small>Thanh tua theo câu, không phải theo giây. Giọng tổng hợp của thiết bị.</small></section><main id="list"></main><script>const pairs=[["와, 진짜 오랜만이다! 잘 지냈어? 요즘 어떻게 지내?", "응, 그럭저럭 지내."], ["요즘도 학교 다니느라 많이 바빠?", "나 요즘 석사 과정 밟고 있어서 좀 바빠."], ["무슨 전공인데? 공부할 만해?", "한국어 교육 전공인데 좀 힘들어. 한국어 교육을 전공하고 있는데도 한국말을 잘 못해서 점점 자신감이 떨어져."], ["한국어로 말할 때 어떤 게 제일 어려워? 말하는 게 어려워, 아니면 알아듣는 게 어려워?", "둘 다야."], ["평소에 한국 사람들이랑 얘기할 기회는 많아?", "난 주로 혼자 공부하는 편이야. 한국인 친구가 별로 없어."], ["한국인 친구를 사귀고 싶기는 해?", "응, 한국인 친구를 사귀고 싶어."], ["먼저 말을 거는 게 좀 어려워?", "응, 그것도 이유 중 하나야."], ["한국말을 틀릴까 봐 먼저 말을 걸기가 어려운 거야?", "응, 그런 것 같아."], ["한국 사람이 먼저 말을 걸어도 긴장돼?", "응. 한국말을 틀릴까 봐 긴장돼."], ["한국 사람이 너무 빨리 말해서 못 알아들으면 어떻게 해?", "보통은 겁이 나서 그냥 대화를 피하는 편이야."], ["상대방이 널 이상하게 생각할까 봐 걱정되는 거야?", "응, 그럴 수도 있지."], ["한국어로 대화하다가 실수해서 창피했던 적 있어?", "응, 그런 적 있어. 계속 실수하다 보면 점점 자신감이 떨어져. 내가 한국말로 얘기했는데 상대방이 무슨 말인지 모르겠다고 하면 속상해."], ["그런 상황에서 다시 설명하려고 해? 아니면 그냥 말을 안 하게 돼?", "그럴 때는 너무 민망해서 그냥 가만히 있어."]],vi=[["Lâu lắm rồi! Vẫn khỏe chứ? Dạo này thế nào?", "Ừ, cũng bình thường."], ["Dạo này vẫn bận đi học à?", "Dạo này mình đang học thạc sĩ nên hơi bận."], ["Chuyên ngành gì? Học có ổn không?", "Mình học giáo dục tiếng Hàn, hơi vất vả. Dù học chuyên ngành này nhưng nói tiếng Hàn chưa tốt nên ngày càng mất tự tin."], ["Khi nói tiếng Hàn, điều gì khó nhất? Nói hay nghe hiểu?", "Cả hai."], ["Bình thường có nhiều cơ hội nói chuyện với người Hàn không?", "Mình chủ yếu học một mình. Không có nhiều bạn người Hàn."], ["Bạn có muốn kết bạn với người Hàn không?", "Ừ, mình muốn kết bạn với người Hàn."], ["Chủ động bắt chuyện hơi khó à?", "Ừ, đó cũng là một lý do."], ["Vì sợ nói sai tiếng Hàn nên khó chủ động bắt chuyện à?", "Ừ, hình như vậy."], ["Người Hàn chủ động bắt chuyện thì bạn cũng căng thẳng à?", "Ừ, mình căng thẳng vì sợ nói sai tiếng Hàn."], ["Nếu người Hàn nói nhanh quá không hiểu thì làm sao?", "Thường mình sợ nên có xu hướng né tránh cuộc trò chuyện."], ["Bạn lo đối phương nghĩ mình kỳ lạ à?", "Ừ, cũng có thể."], ["Bạn từng xấu hổ vì mắc lỗi khi nói tiếng Hàn chưa?", "Ừ, từng rồi. Cứ mắc lỗi thì mình ngày càng mất tự tin. Khi mình nói tiếng Hàn mà đối phương bảo không hiểu thì mình buồn."], ["Lúc đó bạn cố giải thích lại hay không nói nữa?", "Lúc đó mình ngượng quá nên cứ im lặng."]];const $=id=>document.getElementById(id),synth=window.speechSynthesis;let idx=0,token=0,timer,playing=false,whole=false,count=0;const lines=pairs.flat();function voices(){if(!synth)return;let v=$('voice'),old=v.value;v.innerHTML='<option value="">Giọng Hàn mặc định</option>';synth.getVoices().filter(x=>x.lang.startsWith('ko')).forEach(x=>{let o=document.createElement('option');o.value=x.name;o.textContent=x.name;v.append(o)});v.value=old}voices();if(synth)synth.onvoiceschanged=voices; pairs.forEach((p,i)=>{let sec=document.createElement('section');sec.innerHTML='<h2>Hội thoại '+(i+1)+'</h2>';p.forEach((s,j)=>{let n=i*2+j,d=document.createElement('div');d.className='line '+(j?'answer':'');d.id='line'+n;d.innerHTML='<small>'+(j?'Trả lời':'Câu hỏi')+'</small><div class="ko"></div><div class="vi"></div><button>▶ Nghe câu này</button>';d.querySelector('.ko').textContent=s;d.querySelector('.vi').textContent=vi[i][j];d.querySelector('button').onclick=()=>start(n,false);sec.append(d)});$('list').append(sec)});function mark(){ $('seek').value=idx;$('pos').textContent='Câu '+(idx+1)+' / '+lines.length;document.querySelectorAll('.line').forEach((d,i)=>d.classList.toggle('active',i===idx))}function stop(){token++;clearTimeout(timer);if(synth)synth.cancel();playing=false;$('status').textContent='Đã dừng'}function start(n,all){stop();idx=Math.max(0,Math.min(lines.length-1,n));whole=all;count=0;playing=true;mark();speak(token)}function speak(t){if(t!==token)return;if(!synth){$('status').textContent='Thiết bị không hỗ trợ giọng đọc';return}mark();let u=new SpeechSynthesisUtterance(lines[idx]);u.lang='ko-KR';u.rate=Number($('rate').value);let v=synth.getVoices().find(x=>x.name===$('voice').value)||synth.getVoices().find(x=>x.lang.startsWith('ko'));if(v)u.voice=v;$('status').textContent='Đang nghe câu '+(idx+1);u.onerror=()=>{if(t===token){playing=false;$('status').textContent='Không phát được. Thử chọn giọng Hàn khác.'}};u.onend=()=>{if(t!==token)return;count++;let mode=$('mode').value,seconds=mode==='listen'?0.7:Number($('gap').value);let end=Date.now()+seconds*1000;function wait(){if(t!==token)return;let left=Math.ceil((end-Date.now())/1000);if(left>0){$('status').textContent='Đến lượt bạn · '+left+' giây';timer=setTimeout(wait,200);return}let r=Number($('repeat').value);if(!r||count<r){speak(t);return}if(whole){let step=mode==='answer'?2:1;let next=mode==='answer'?(Math.floor(idx/2)*2+2):idx+step;if(next<lines.length){idx=next;count=0;speak(t);return}}playing=false;$('status').textContent='Hoàn thành'}wait()};synth.speak(u)}$('play').onclick=()=>start($('mode').value==='answer'?Math.floor(idx/2)*2:idx,true);$('pause').onclick=stop;$('prev').onclick=()=>start(idx-1,whole&&playing);$('next').onclick=()=>start(idx+1,whole&&playing);$('seek').oninput=()=>{let was=playing,all=whole,n=Number($('seek').value);if(was)start(n,all);else{idx=n;mark()}};$('ko').onchange=()=>document.body.classList.toggle('hideko',!$('ko').checked);$('vi').onchange=()=>document.body.classList.toggle('hidevi',!$('vi').checked);mark();</script></html>
